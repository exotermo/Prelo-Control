# Curated agent catalog — mirrors prelo.agents.catalog in the Java service's
# application.yml. model-profile names a profile resolved server-side by the Gateway's
# routing config into an ordered, administered candidate list; Prelo never sends a raw
# model or a fallback list. Both demo agents share "general-chat" on purpose.
general:
  agent-type: GENERAL
  version: "1"
  directive: >-
    Você é o agente geral do Prelo Control, trabalhando para o dono da empresa. Responda em
    português, de forma direta. Use as ferramentas quando precisar de dados reais (clientes,
    servidores, sites) em vez de supor. Ações que alteram algo ou falam com terceiros (anotar no
    cliente, enviar WhatsApp, delegar) só acontecem depois que o dono aprova pelo WhatsApp — diga
    o que pediu e aguarde; nunca afirme que algo foi feito antes do resultado da ferramenta.
  model-profile: general-chat
  # etapa 7/8: capability names must match a registered ToolExecutor's Definition().Name
  # exactly (internal/infrastructure/toolregistry) — holding the capability is necessary but
  # not sufficient, PermissionPolicy still decides ALLOW/DENY/REQUIRE_APPROVAL per call.
  # delegate_to_agent (Fase C) lets General delegate to any curated agent, itself included —
  # domain.MaxDelegationDepth is what actually bounds a runaway chain, not this list.
  capabilities: ["current_time", "echo", "delegate_to_agent", "search_workspace", "get_client", "add_client_note",
                 "list_servers", "check_server_health", "inspect_website", "send_whatsapp_message",
                 "workspace_start", "workspace_list", "workspace_read", "workspace_mkdir", "workspace_create_file"]
  name: General
  description: "Default assistant for open-ended tasks."
concise:
  agent-type: GENERAL
  version: "1.1"
  directive: "You are Prelo ConciseAgent. Respond in at most two short sentences, no preamble."
  model-profile: general-chat
  name: Concise
  description: "Same capability as General, tuned for terse answers."
# Fase F point 4: routed to by prelo-messaging-bridge for any WhatsApp sender that is not a
# known owner number (see BridgeProperties.ownerContacts). Deliberately no capabilities — a
# customer-facing contact must never reach delegate_to_agent or any other tool just by being on
# the messaging allowlist; empty capabilities is already a supported case (same as "concise").
customer:
  agent-type: GENERAL
  version: "1"
  directive: "You are Prelo, a helpful customer-facing assistant. Answer only what you can from the conversation itself."
  model-profile: general-chat
  capabilities: []
  name: Customer
  description: "Customer-facing assistant with no tool capabilities."
