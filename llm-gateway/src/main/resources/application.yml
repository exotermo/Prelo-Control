server:
  port: 8081
spring:
  application:
    name: llm-gateway
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: gateway_flyway_schema_history
    schemas: gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
gateway:
  jwt:
    secret: ${GATEWAY_JWT_SECRET}
    issuer: ${GATEWAY_JWT_ISSUER:prelo-dev}
    audience: ${GATEWAY_JWT_AUDIENCE:llm-gateway}
  provider:
    mock:
      enabled: ${GATEWAY_PROVIDER_MOCK_ENABLED:true}
    anthropic:
      enabled: ${GATEWAY_PROVIDER_ANTHROPIC_ENABLED:false}
      base-url: ${GATEWAY_PROVIDER_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key-file: ${GATEWAY_PROVIDER_ANTHROPIC_API_KEY_FILE:/run/secrets/anthropic_api_key}
      models: ${GATEWAY_PROVIDER_ANTHROPIC_MODELS:claude-3-5-sonnet-latest,claude-3-5-haiku-latest}
      timeout: ${GATEWAY_PROVIDER_ANTHROPIC_TIMEOUT:30s}
      max-tokens: ${GATEWAY_PROVIDER_ANTHROPIC_MAX_TOKENS:1024}
      api-version: "2023-06-01"
  # Fase M: dashboard-managed provider connections (instance default + per-project), keys sealed
  # with a master key read from a Docker secret. Without that file, connections are disabled.
  connections:
    master-key-file: ${GATEWAY_CONNECTIONS_MASTER_KEY_FILE:/run/secrets/gateway_connections_key}
    allow-private-urls: ${GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS:false}
    chat-timeout: ${GATEWAY_CONNECTIONS_CHAT_TIMEOUT:60s}
    test-timeout: 10s
    max-tokens: ${GATEWAY_CONNECTIONS_MAX_TOKENS:1024}
  routing:
    total-budget: 20s
    retry-on-rate-limit: true
    # No real Anthropic key is provisioned in this environment, so general-chat/dev-chat both
    # resolve to MockProvider for now — this is an explicit config choice (dev-chat is the
    # documented "mock is fine here" profile), not an implicit fallback. Once a real key +
    # gateway.provider.anthropic.enabled=true are set, prepend anthropic:<model> to
    # general-chat's candidates; leave dev-chat mock-only.
    profiles:
      general-chat:
        candidates:
          - mock:mock-echo
      dev-chat:
        candidates:
          - mock:mock-echo
      # Keeps the standalone /api/v1/llm/chat smoke test (see CURRENT_STATE.md) working with its
      # historical literal "mock-echo" request body, now that modelProfile replaces a raw model.
      mock-echo:
        candidates:
          - mock:mock-echo
