# Pinned so renaming/moving this directory never changes the volume/network names.
name: hermeserenato

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hermes_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm-gateway:
    build:
      context: ./llm-gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hermes?currentSchema=gateway
      SPRING_DATASOURCE_USERNAME: hermes
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_JWT_SECRET: ${HERMES_GATEWAY_JWT_SECRET:?set HERMES_GATEWAY_JWT_SECRET in .env}
      GATEWAY_JWT_ISSUER: ${HERMES_GATEWAY_ISSUER:-hermes-dev}
      GATEWAY_JWT_AUDIENCE: ${HERMES_GATEWAY_AUDIENCE:-llm-gateway}
      GATEWAY_PROVIDER_MOCK_ENABLED: "true"
      GATEWAY_PROVIDER_ANTHROPIC_ENABLED: ${GATEWAY_PROVIDER_ANTHROPIC_ENABLED:-false}
      GATEWAY_PROVIDER_ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Fase M: master key sealing the provider keys saved from the dashboard (AES-256-GCM over a
      # per-record HKDF data key). Mounted as a file only here — never in the database, never in
      # hermes-go. DEV ONLY: set GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS=true to reach a local Ollama.
      GATEWAY_CONNECTIONS_MASTER_KEY_FILE: /run/secrets/gateway_connections_key
      GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS: ${GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS:-false}
    secrets:
      - anthropic_api_key
      - gateway_connections_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes_internal
      - hermes_egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # PARKED (2026-09-23): hermes-go is now the production service (ADR-012/ADR-013 cutover,
  # authorized by the project owner). hermes-app (Java) is kept as source-only reference — code
  # untouched, never deleted — but excluded from the default `docker compose up`. Start it
  # explicitly with `docker compose --profile legacy-java up hermes` if you need to compare
  # behavior against it again.
  hermes:
    profiles: ["legacy-java"]
    build:
      context: ./hermes-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hermes?currentSchema=hermes_app
      SPRING_DATASOURCE_USERNAME: hermes
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      HERMES_GATEWAY_BASE_URL: http://llm-gateway:8081
      HERMES_GATEWAY_JWT_SECRET: ${HERMES_GATEWAY_JWT_SECRET:?set HERMES_GATEWAY_JWT_SECRET in .env}
      HERMES_GATEWAY_ISSUER: ${HERMES_GATEWAY_ISSUER:-hermes-dev}
      HERMES_GATEWAY_AUDIENCE: ${HERMES_GATEWAY_AUDIENCE:-llm-gateway}
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - hermes_internal
      - hermes_publish
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - hermes_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local SMTP catcher for dev/testing the dashboard-auth email flow (activation link, password
  # reset) without real SMTP credentials — captures everything sent to it, nothing leaves the
  # host. Point HERMES_GO_SMTP_* at a real provider for production; this container is not meant
  # to run there. Same pattern as messager-interface's mailpit service.
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - hermes_internal
      - hermes_publish
    ports:
      - "127.0.0.1:8026:8025"
    restart: unless-stopped

  hermes-go:
    build:
      context: ./hermes-app-go
      # LOCAL-DEV WORKAROUND — a problem of the developer's own machine, NOT of this project and
      # NOT to be carried to the server that runs Hermes. On that workstation the BuildKit
      # sandbox's DNS (1.0.0.1) times out resolving proxy.golang.org, so `go mod download`
      # (hermes-app-go/Dockerfile; vendor/ is intentionally not versioned) fails on the default
      # build network. Host networking uses the host's working resolver instead.
      # On any host whose Docker builds can reach proxy.golang.org, DELETE this line (or fix the
      # daemon DNS via "dns" in /etc/docker/daemon.json) — see docs/DEV_HOST_NOTES.md.
      network: host
    environment:
      HERMES_GO_PORT: "8080"
      HERMES_GO_DB_HOST: postgres
      HERMES_GO_DB_PORT: "5432"
      HERMES_GO_DB_NAME: hermes
      HERMES_GO_DB_SCHEMA: hermes_app
      HERMES_GO_DB_USER: hermes
      HERMES_GO_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      HERMES_GO_REDIS_ADDR: redis:6379
      HERMES_GATEWAY_BASE_URL: http://llm-gateway:8081
      HERMES_GATEWAY_JWT_SECRET: ${HERMES_GATEWAY_JWT_SECRET:?set HERMES_GATEWAY_JWT_SECRET in .env}
      HERMES_GATEWAY_ISSUER: ${HERMES_GATEWAY_ISSUER:-hermes-dev}
      HERMES_GATEWAY_AUDIENCE: ${HERMES_GATEWAY_AUDIENCE:-llm-gateway}
      # Inbound API authentication is independent from the LLM gateway credential. The value
      # must be the same signing secret used by messaging-core integration access tokens.
      HERMES_GO_API_JWT_SECRET: ${HERMES_GO_API_JWT_SECRET:?set HERMES_GO_API_JWT_SECRET in .env}
      HERMES_GO_API_JWT_ISSUER: ${HERMES_GO_API_JWT_ISSUER:-messaging-core}
      HERMES_GO_API_JWT_AUDIENCE: ${HERMES_GO_API_JWT_AUDIENCE:-messaging-core}
      HERMES_GO_API_AUTH_ENABLED: "true"
      HERMES_GO_TOOL_TIMEOUT_SECONDS: ${HERMES_GO_TOOL_TIMEOUT_SECONDS:-30}
      HERMES_GO_TOOL_MAX_ARGS_BYTES: ${HERMES_GO_TOOL_MAX_ARGS_BYTES:-65536}
      HERMES_GO_TOOL_MAX_RESULT_BYTES: ${HERMES_GO_TOOL_MAX_RESULT_BYTES:-65536}
      HERMES_GO_TOOL_MAX_CONCURRENT: ${HERMES_GO_TOOL_MAX_CONCURRENT:-16}
      # Fase G1: human login (password + mandatory TOTP) for hermes-dashboard.
      HERMES_GO_DASHBOARD_MFA_KEY: ${HERMES_GO_DASHBOARD_MFA_KEY:?set HERMES_GO_DASHBOARD_MFA_KEY in .env (openssl rand -base64 32)}
      HERMES_GO_DASHBOARD_PUBLIC_URL: ${HERMES_GO_DASHBOARD_PUBLIC_URL:-http://127.0.0.1:5176}
      HERMES_GO_DASHBOARD_SECURE_COOKIE: ${HERMES_GO_DASHBOARD_SECURE_COOKIE:-false}
      # Credentialed CORS allowlist (refresh/logout send credentials: "include" for the session
      # cookie) — must be the dashboard's exact origin(s), never "*". See platform/cors.go.
      HERMES_GO_DASHBOARD_ALLOWED_ORIGINS: ${HERMES_GO_DASHBOARD_ALLOWED_ORIGINS:-http://127.0.0.1:5176,http://localhost:5176}
      HERMES_GO_ADMIN_TOKEN: ${HERMES_GO_ADMIN_TOKEN:?set HERMES_GO_ADMIN_TOKEN in .env}
      HERMES_GO_DASHBOARD_MAIL_FROM: ${HERMES_GO_DASHBOARD_MAIL_FROM:-}
      HERMES_GO_SMTP_HOST: ${HERMES_GO_SMTP_HOST:-}
      HERMES_GO_SMTP_PORT: ${HERMES_GO_SMTP_PORT:-587}
      HERMES_GO_SMTP_USER: ${HERMES_GO_SMTP_USER:-}
      HERMES_GO_SMTP_PASSWORD: ${HERMES_GO_SMTP_PASSWORD:-}
      HERMES_GO_SMTP_AUTH: ${HERMES_GO_SMTP_AUTH:-true}
      HERMES_GO_SMTP_STARTTLS: ${HERMES_GO_SMTP_STARTTLS:-true}
      # Fase G2: optional — lets the Configurações page manage the bridge's owner-contacts list.
      # HERMES_BRIDGE_ADMIN_TOKEN must equal that service's own BRIDGE_ADMIN_TOKEN.
      HERMES_BRIDGE_ADMIN_URL: ${HERMES_BRIDGE_ADMIN_URL:-}
      HERMES_BRIDGE_ADMIN_TOKEN: ${HERMES_BRIDGE_ADMIN_TOKEN:-}
      # Fase S1: optional — lets the Servidores page register servers and SSH into them for
      # health checks. Must be a DIFFERENT 32-byte Base64 key than HERMES_GO_DASHBOARD_MFA_KEY —
      # an SSH private key and a human's TOTP secret must never share an encryption key.
      HERMES_GO_SERVER_CREDENTIALS_KEY: ${HERMES_GO_SERVER_CREDENTIALS_KEY:-}
      # Fase I: optional — enables per-project API keys and outbound webhooks. Its own 32-byte
      # Base64 key (webhook signing secrets), never shared with the TOTP or SSH-credential keys.
      HERMES_GO_INTEGRATIONS_KEY: ${HERMES_GO_INTEGRATIONS_KEY:-}
      # Fase PA: optional — project files sealed at rest (per-file HKDF key, chunked AES-256-GCM).
      # Its own 32-byte Base64 key; losing it makes every stored file unreadable — back it up.
      HERMES_GO_FILES_KEY: ${HERMES_GO_FILES_KEY:-}
      # DEV ONLY: lets webhooks target private/loopback addresses and plain http:// (turns off
      # the SSRF guard). Must stay false anywhere real.
      HERMES_GO_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${HERMES_GO_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - project_files:/data/project-files
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      hermes_internal:
      hermes_publish:
      hermes-shared:
        aliases:
          - hermes-go
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  hermes_internal:
    internal: true
  hermes_egress:
  hermes_publish:
  # Rede compartilhada com ~/projects/hermes-messaging-bridge (criada fora do compose com
  # `docker network create hermes-shared`) — só hermes-go entra aqui, pra o bridge conseguir
  # chamar a API de tasks por nome de container, sem publicar porta nenhuma pra fora.
  hermes-shared:
    external: true

volumes:
  postgres_data:
  project_files:

# Sourced from an env var (ANTHROPIC_API_KEY, via .env), not a committed file — still reaches the
# container exclusively as a mounted file at /run/secrets/anthropic_api_key, never as an env var
# inside the container itself. Mounted only in llm-gateway; hermes never sees this secret.
secrets:
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY
  # Fase M: 32 random bytes, Base64 (openssl rand -base64 32), from .env. Losing it makes every
  # saved provider key unreadable (they must be re-entered) — back it up like a password.
  gateway_connections_key:
    environment: GATEWAY_CONNECTIONS_MASTER_KEY
