# Pinned so renaming/moving this directory never changes the volume/network names.
name: prelo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prelo
      POSTGRES_USER: prelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prelo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prelo -d prelo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm-gateway:
    build:
      context: ./llm-gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prelo?currentSchema=gateway
      SPRING_DATASOURCE_USERNAME: prelo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GATEWAY_JWT_SECRET: ${PRELO_GATEWAY_JWT_SECRET:?set PRELO_GATEWAY_JWT_SECRET in .env}
      GATEWAY_JWT_ISSUER: ${PRELO_GATEWAY_ISSUER:-prelo-dev}
      GATEWAY_JWT_AUDIENCE: ${PRELO_GATEWAY_AUDIENCE:-llm-gateway}
      GATEWAY_PROVIDER_MOCK_ENABLED: "true"
      GATEWAY_PROVIDER_ANTHROPIC_ENABLED: ${GATEWAY_PROVIDER_ANTHROPIC_ENABLED:-false}
      GATEWAY_PROVIDER_ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Fase M: master key sealing the provider keys saved from the dashboard (AES-256-GCM over a
      # per-record HKDF data key). Mounted as a file only here — never in the database, never in
      # prelo-core. DEV ONLY: set GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS=true to reach a local Ollama.
      GATEWAY_CONNECTIONS_MASTER_KEY_FILE: /run/secrets/gateway_connections_key
      GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS: ${GATEWAY_CONNECTIONS_ALLOW_PRIVATE_URLS:-false}
      # Fase X: subscription CLIs (claude_cli / codex_cli connections) run in cli-runner.
      GATEWAY_CONNECTIONS_CLI_RUNNER_URL: http://cli-runner:8099
      GATEWAY_CONNECTIONS_CLI_RUNNER_TOKEN: ${PRELO_CLI_RUNNER_TOKEN:?set PRELO_CLI_RUNNER_TOKEN in .env}
    secrets:
      - anthropic_api_key
      - gateway_connections_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prelo_internal
      - prelo_egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Fase X: the owner's Claude Code / Codex CLIs (Pro plans) as a text-only model for llm-gateway.
  # Logged in once, with its own credentials kept in the cli_home volume (never the host's):
  #   docker compose exec -it cli-runner codex login --device-auth
  #   docker compose exec -it cli-runner claude        (then /login, then /exit)
  # Only llm-gateway reaches it (internal network + shared token); egress is for the vendors' APIs.
  cli-runner:
    build:
      context: ./cli-runner
    environment:
      CLI_RUNNER_TOKEN: ${PRELO_CLI_RUNNER_TOKEN:?set PRELO_CLI_RUNNER_TOKEN in .env}
      CLI_RUNNER_CONCURRENCY: ${PRELO_CLI_RUNNER_CONCURRENCY:-2}
    volumes:
      - cli_home:/home/runner
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - prelo_internal
      - prelo_egress
    restart: unless-stopped

  # PARKED (2026-09-23): prelo-core is now the production service (ADR-012/ADR-013 cutover,
  # authorized by the project owner). legacy-java-app (Java) is kept as source-only reference — code
  # untouched, never deleted — but excluded from the default `docker compose up`. Start it
  # explicitly with `docker compose --profile legacy-java up prelo` if you need to compare
  # behavior against it again.
  prelo:
    profiles: ["legacy-java"]
    build:
      context: ./legacy-java-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prelo?currentSchema=prelo_app
      SPRING_DATASOURCE_USERNAME: prelo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PRELO_GATEWAY_BASE_URL: http://llm-gateway:8081
      PRELO_GATEWAY_JWT_SECRET: ${PRELO_GATEWAY_JWT_SECRET:?set PRELO_GATEWAY_JWT_SECRET in .env}
      PRELO_GATEWAY_ISSUER: ${PRELO_GATEWAY_ISSUER:-prelo-dev}
      PRELO_GATEWAY_AUDIENCE: ${PRELO_GATEWAY_AUDIENCE:-llm-gateway}
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - prelo_internal
      - prelo_publish
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - prelo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local SMTP catcher for dev/testing the dashboard-auth email flow (activation link, password
  # reset) without real SMTP credentials — captures everything sent to it, nothing leaves the
  # host. Point PRELO_SMTP_* at a real provider for production; this container is not meant
  # to run there. Same pattern as messager-interface's mailpit service.
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - prelo_internal
      - prelo_publish
    ports:
      - "127.0.0.1:8026:8025"
    restart: unless-stopped

  prelo-core:
    build:
      context: ./prelo-core
      # LOCAL-DEV WORKAROUND — a problem of the developer's own machine, NOT of this project and
      # NOT to be carried to the server that runs Prelo. On that workstation the BuildKit
      # sandbox's DNS (1.0.0.1) times out resolving proxy.golang.org, so `go mod download`
      # (prelo-core/Dockerfile; vendor/ is intentionally not versioned) fails on the default
      # build network. Host networking uses the host's working resolver instead.
      # On any host whose Docker builds can reach proxy.golang.org, DELETE this line (or fix the
      # daemon DNS via "dns" in /etc/docker/daemon.json) — see docs/DEV_HOST_NOTES.md.
      network: host
    environment:
      PRELO_PORT: "8080"
      PRELO_DB_HOST: postgres
      PRELO_DB_PORT: "5432"
      PRELO_DB_NAME: prelo
      PRELO_DB_SCHEMA: prelo_app
      PRELO_DB_USER: prelo
      PRELO_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PRELO_REDIS_ADDR: redis:6379
      PRELO_GATEWAY_BASE_URL: http://llm-gateway:8081
      PRELO_GATEWAY_JWT_SECRET: ${PRELO_GATEWAY_JWT_SECRET:?set PRELO_GATEWAY_JWT_SECRET in .env}
      PRELO_GATEWAY_ISSUER: ${PRELO_GATEWAY_ISSUER:-prelo-dev}
      PRELO_GATEWAY_AUDIENCE: ${PRELO_GATEWAY_AUDIENCE:-llm-gateway}
      # Inbound API authentication is independent from the LLM gateway credential. The value
      # must be the same signing secret used by messaging-core integration access tokens.
      PRELO_API_JWT_SECRET: ${PRELO_API_JWT_SECRET:?set PRELO_API_JWT_SECRET in .env}
      PRELO_API_JWT_ISSUER: ${PRELO_API_JWT_ISSUER:-messaging-core}
      PRELO_API_JWT_AUDIENCE: ${PRELO_API_JWT_AUDIENCE:-messaging-core}
      PRELO_API_AUTH_ENABLED: "true"
      PRELO_TOOL_TIMEOUT_SECONDS: ${PRELO_TOOL_TIMEOUT_SECONDS:-30}
      PRELO_TOOL_MAX_ARGS_BYTES: ${PRELO_TOOL_MAX_ARGS_BYTES:-65536}
      PRELO_TOOL_MAX_RESULT_BYTES: ${PRELO_TOOL_MAX_RESULT_BYTES:-65536}
      PRELO_TOOL_MAX_CONCURRENT: ${PRELO_TOOL_MAX_CONCURRENT:-16}
      # Fase G1: human login (password + mandatory TOTP) for prelo-dashboard.
      PRELO_DASHBOARD_MFA_KEY: ${PRELO_DASHBOARD_MFA_KEY:?set PRELO_DASHBOARD_MFA_KEY in .env (openssl rand -base64 32)}
      PRELO_DASHBOARD_PUBLIC_URL: ${PRELO_DASHBOARD_PUBLIC_URL:-http://127.0.0.1:5176}
      PRELO_DASHBOARD_SECURE_COOKIE: ${PRELO_DASHBOARD_SECURE_COOKIE:-false}
      # Credentialed CORS allowlist (refresh/logout send credentials: "include" for the session
      # cookie) — must be the dashboard's exact origin(s), never "*". See platform/cors.go.
      PRELO_DASHBOARD_ALLOWED_ORIGINS: ${PRELO_DASHBOARD_ALLOWED_ORIGINS:-http://127.0.0.1:5176,http://localhost:5176}
      PRELO_ADMIN_TOKEN: ${PRELO_ADMIN_TOKEN:?set PRELO_ADMIN_TOKEN in .env}
      PRELO_DASHBOARD_MAIL_FROM: ${PRELO_DASHBOARD_MAIL_FROM:-}
      PRELO_SMTP_HOST: ${PRELO_SMTP_HOST:-}
      PRELO_SMTP_PORT: ${PRELO_SMTP_PORT:-587}
      PRELO_SMTP_USER: ${PRELO_SMTP_USER:-}
      PRELO_SMTP_PASSWORD: ${PRELO_SMTP_PASSWORD:-}
      PRELO_SMTP_AUTH: ${PRELO_SMTP_AUTH:-true}
      PRELO_SMTP_STARTTLS: ${PRELO_SMTP_STARTTLS:-true}
      # Fase G2: optional — lets the Configurações page manage the bridge's owner-contacts list.
      # PRELO_BRIDGE_ADMIN_TOKEN must equal that service's own BRIDGE_ADMIN_TOKEN.
      PRELO_BRIDGE_ADMIN_URL: ${PRELO_BRIDGE_ADMIN_URL:-}
      PRELO_BRIDGE_ADMIN_TOKEN: ${PRELO_BRIDGE_ADMIN_TOKEN:-}
      # Fase S1: optional — lets the Servidores page register servers and SSH into them for
      # health checks. Must be a DIFFERENT 32-byte Base64 key than PRELO_DASHBOARD_MFA_KEY —
      # an SSH private key and a human's TOTP secret must never share an encryption key.
      PRELO_SERVER_CREDENTIALS_KEY: ${PRELO_SERVER_CREDENTIALS_KEY:-}
      # Fase I: optional — enables per-project API keys and outbound webhooks. Its own 32-byte
      # Base64 key (webhook signing secrets), never shared with the TOTP or SSH-credential keys.
      PRELO_INTEGRATIONS_KEY: ${PRELO_INTEGRATIONS_KEY:-}
      # Fase PA: optional — project files sealed at rest (per-file HKDF key, chunked AES-256-GCM).
      # Its own 32-byte Base64 key; losing it makes every stored file unreadable — back it up.
      PRELO_FILES_KEY: ${PRELO_FILES_KEY:-}
      # DEV ONLY: lets webhooks target private/loopback addresses and plain http:// (turns off
      # the SSRF guard). Must stay false anywhere real.
      PRELO_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${PRELO_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      # G11: push to the Work Control app (FCM). The service-account JSON is mounted read-only below;
      # while PRELO_FCM_SERVICE_ACCOUNT_FILE is unset the mount is /dev/null and push stays off.
      PRELO_FCM_CREDENTIALS_FILE: /run/secrets/fcm-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - project_files:/data/project-files
      - ${PRELO_FCM_SERVICE_ACCOUNT_FILE:-/dev/null}:/run/secrets/fcm-service-account.json:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      prelo_internal:
      prelo_publish:
      prelo-shared:
        aliases:
          - prelo-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  prelo_internal:
    internal: true
  prelo_egress:
  prelo_publish:
  # Rede compartilhada com ~/projects/prelo-messaging-bridge (criada fora do compose com
  # `docker network create prelo-shared`) — só prelo-core entra aqui, pra o bridge conseguir
  # chamar a API de tasks por nome de container, sem publicar porta nenhuma pra fora.
  prelo-shared:
    external: true

volumes:
  postgres_data:
  project_files:
  # Fase X: cli-runner's HOME — the CLIs' own logins (back up/remove like credentials).
  cli_home:

# Sourced from an env var (ANTHROPIC_API_KEY, via .env), not a committed file — still reaches the
# container exclusively as a mounted file at /run/secrets/anthropic_api_key, never as an env var
# inside the container itself. Mounted only in llm-gateway; prelo never sees this secret.
secrets:
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY
  # Fase M: 32 random bytes, Base64 (openssl rand -base64 32), from .env. Losing it makes every
  # saved provider key unreadable (they must be re-entered) — back it up like a password.
  gateway_connections_key:
    environment: GATEWAY_CONNECTIONS_MASTER_KEY
