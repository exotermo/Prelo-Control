server:
  port: 8080
spring:
  application:
    name: hermes-app
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: hermes_flyway_schema_history
    schemas: hermes_app
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
hermes:
  gateway:
    base-url: ${HERMES_GATEWAY_BASE_URL}
    jwt-secret: ${HERMES_GATEWAY_JWT_SECRET}
    issuer: ${HERMES_GATEWAY_ISSUER:hermes-dev}
    audience: ${HERMES_GATEWAY_AUDIENCE:llm-gateway}
